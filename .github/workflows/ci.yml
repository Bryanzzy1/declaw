name: ci

on:
  push:
  pull_request:

# declaw is stdlib-only, so CI just runs the built-in selftest and the test suite
# across the supported Python versions on Linux and Windows (the clipboard path is
# Windows-only, but the pure-text logic must pass on both).
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Selftest
        run: python declaw.py selftest

      - name: Test suite
        run: python tests/test_declaw.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run ruff check .
